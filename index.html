<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* ส่วนที่ 1: เต็มหน้าจอแรกพอดี (Coming Soon + Hashtag) */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5vw;
        }

        .title {
            font-size: clamp(2rem, 12vw, 10rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            line-height: 0.9;
            white-space: nowrap;
        }

        .hashtag {
            font-size: clamp(0.8rem, 2.5vw, 2rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 1rem;
            white-space: nowrap;
        }

        /* ส่วนที่ 2: ต้องเลื่อนลงมาถึงจะเจอ (กล่องข้อความ, ลูกศร, กล่องลิงก์) */
        .content-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5vh 5vw 15vh 5vw;
        }

        /* กล่องข้อความสำหรับแก้ไขเอง */
        .editable-text-box {
            font-size: 1.2rem;
            font-weight: 500;
            padding: 15px 30px;
            border: 2px dashed #000000; 
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        /* อักษรหรือสัญลักษณ์ชี้ลงมา */
        .arrow-box {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }

        /* กล่องเปล่าสำหรับทำลิงก์ */
        .link-box {
            width: 200px;
            height: 50px;
            border: 2px solid #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #000000;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .link-box:hover {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="content-section">
        <!-- กล่องข้อความ (แก้ข้อความข้างในนี้ได้เลย) -->
        <div>
            จะบอกว่ายังไม่ได้คิดหรอกว่าจะทำอะไร...<br>
            แต่เอาเป็นว่าเพลงเพราะนะ ฟังดูเถอะทุกคน<br>
            มันต้องมีสักวันที่เป็นของเรา
        </div>

        <!-- กล่องอักษรชี้ลงมา -->
        <div class="arrow-box">
            ↓
        </div>

        <!-- กล่องลิงก์เปล่า (เปลี่ยน href="..." เป็นลิงก์ที่ต้องการ) -->
        <a href="https://www.youtube.com/watch?v=-slgX5Bn_rE" class="link-box">
            Link To Youtube krub
        </a>
    </div>

    <!-- ส่วนหน้าจอแรก: โผล่มาเห็นทันที -->
    <div class="hero-section">
        <div><h2>(Maybe)</h2></div>
        <h1 class="title">Coming Soon</h1>
        <div class="hashtag">#Monet3rdonelasttime</div>
    </div>

</body>
</html>
